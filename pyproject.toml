[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-base"
version = "0.1.0"
description = "A local Word document RAG knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "openai>=2.0,<3",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "lxml>=5,<7",
    "qdrant-client>=1.15,<2",
]

[project.scripts]
rag = "src.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["src"]